{% extends 'base.html'%}
{% block head %}
<link rel="stylesheet" href="{{url_for('static', filename='css/login.css')}}">
{% endblock %}
<!-- bloque de barra de navegación vacío-->
{% block header %}
{% endblock %}
{% block content %}
<section class="login">
    <!-- Login -->
    <main class="form-signin w-100 m-auto text-center">
        <img class="mb-4" src="{{url_for('static', filename='/img/bp-dark.png')}}" alt="" width="72">
        <h1 class="h3 mb-3 fw-normal">{% block title %} {{messages['login']}}{% endblock %}</h1>
        <form class="" method="post">
            <div class="form-floating">
                <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                <label for="email">{{messages['email']}}</label>
            </div>
            <div class="form-floating">
                <input type="password" class="form-control" id="password" name="password" required placeholder="Password">
                <label for="password">{{messages['password']}}</label>
            </div>

            <div class="checkbox mb-3">
                <label>
                    <input type="checkbox" value="remember-me">{{messages['remember_data']}}</label>
            </div>
            <button class="w-100 btn btn-lg btn-primary" type="submit">{{messages['login']}}</button>
        </form>
        <hr class="my-4">
        <p class="text-muted text-center">{{messages['blog_description5']}}
            <a href="{{url_for('auth.register', lang=lang)}}">{{messages['create_account']}}</a>
        </p>
    </main>
</section>
{% endblock %}
