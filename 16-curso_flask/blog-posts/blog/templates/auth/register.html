{% extends 'base.html'%}
<!-- bloque de barra de navegación vacío-->
{% block header %}
{% endblock %}
{% block content %}
    <!-- Sección de bienvenida -->
    <div class="container col-xl-10 col-xxl-8 px-4 py-5">
        <div class="row align-items-center g-lg-5 py-5">
            <div class="col-lg-7 text-center text-lg-start">
                <h1 class="display-4 fw-bold  mb-3 fst-italic">{{messages['register_title']}}</h1>
                <p class="col-lg-10 fs-4">{{messages['register_desc1']}}</p>
                <p class="col-lg-10 fs-4">{{messages['register_desc2']}}</p>
            </div>
            <div class="col-md-10 mx-auto col-lg-5">
                <form class="p-4 p-md-5 border rounded-3 bg-light" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" required placeholder="name@example.com">
                        <label for="username">{{messages['username']}}</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                        <label for="email">{{messages['email']}}</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" required minlength="4" name="password" placeholder="Password">
                        <label for="password">{{messages['password']}}</label>
                    </div>

                    <button class="w-100 btn btn-lg btn-primary" type="submit">{{messages['signup']}}</button>
                    <hr class="my-4">
                    <p class="text-muted text-center">{{messages['register_desc3']}}
                        <a href="{{url_for('auth.login', lang=lang)}}">{{messages['login']}}</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
