{% extends 'base.html'%}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-sm-8">
      <div class="card">
        <div class="card-header">
          <h1 class="text-center">{% block title %}{{messages['login']}}{% endblock %}</h1>
        </div>
        <div class="card-body">
          <form action="" method="post">
            <div class="form-group">
              <label for="username">{{messages['username']}}</label>
              <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group">
              <label for="password">{{messages['password']}}</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="text-center mt-3">
              <input type="submit" value="{{messages['login']}}" class="btn btn-primary">
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
