{% extends 'base.html' %}
{% block content %}
<div class="container-sm">
  <h3 class="text-center mb-3 mt-3">{% block title %}Editar tarea{% endblock %}</h3>
  <form action="" method="post">
    <div class="form-group">
      <label for="title">Título</label>
      <input type="text" class="form-control" name="title" id="title" required value="{{todo.title}}">
      <br>
      <label for="description">Descripción</label>
      <textarea class="form-control" name="description" id="description" rows="5">{{todo.desc}}</textarea>
    </div>
    <br>
    <div class="form-group">
      <label for="state">Completado</label>
      <input class="form-check-input" type="checkbox" name="state" id="state" {% if todo.state == true %} checked {% endif %}>
    </div>
    <br>
    <div class="form-group">
      <input type="submit" class="btn btn-primary" value="Guardar">
      <a href="{{ url_for('todo.index')}}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
