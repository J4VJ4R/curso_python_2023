<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;
      margin: 0;
    }
    body{
      font-family: Arial, Helvetica, sans-serif;
    }
    table, th, td{
      margin: 10px;
      border: 1px solid black;
    }
    table{
      border-collapse: collapse;
      width: 500px;
      text-align: center;
    }
    th, td{
      padding: 10px;
    }
    th{
      background: rgb(107, 188, 190);
      color: white;
    }
    tr:hover{
      background: gainsboro;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th>Nombre</th>
      <th>Edad</th>
      <th>Pais</th>
    </tr>
    <tr>
      <td>Alex</td>
      <td>26</td>
      <td>Perú</td>
    </tr>
    <tr>
      <td>Juan</td>
      <td>28</td>
      <td>Colombia</td>
    </tr>
  </table>
</body>
</html>
